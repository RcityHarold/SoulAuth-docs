name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# GitHub Pages 部署所需的最小权限集。
permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署；排队而不是取消进行中的那个，
# 免得一次 push 把上一次已经部署到一半的产物留在中间状态。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # lastUpdated 需要完整历史，否则每页的「最后更新」都是同一个时间。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # base 从仓库名推导，不写死 —— 仓库改名时 base 会跟着走，
      # 否则所有资源 404 而构建依然是绿的。
      - name: Build
        run: npm run build
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/

      - run: npm run check:anchors
      # 文档不得复述端点/路由计数 —— 那份事实归 contracts/openapi.yaml，
      # 由 SoulAuth 仓库的 tests/conformance.rs::j4 守卫。
      - run: npm run check:endpoints

      # enablement: true 让 workflow 自己开启 Pages。
      # 不加的话，仓库没在 Settings → Pages 里把 Source 选成 GitHub Actions 时，
      # 这一步会以 "Get Pages site failed" 失败 —— 而失败原因在构建日志里，
      # 不在你会去看的那个页面上。
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: docs/.vitepress/dist

  deploy:
    # PR 只构建校验，不部署。
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
